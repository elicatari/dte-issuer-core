name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: ./mvnw -B verify

  # Mismo evento que verify: un gate solo en push a main no bloquea el merge.
  # PIT, no verify: el umbral de mutación no re-ejecuta IT ni jacoco:check.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Mutation
        run: ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage